<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Appointment</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/updateAppointment.css" />
    <script src="../js/util.js" defer></script>
    <script src="../js/render.js" defer></script>
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>

            <main class="main-content">
                <h2>Update <span>Appointment</span></h2>

                <form id="updateAppointmentForm" class="appointment-form">
                    <div class="form-group">
                        <label>Patient Name</label>
                        <input type="text" id="patientName" class="input-field" readonly />
                    </div>
                    <div class="form-group">
                        <label>Doctor Name</label>
                        <input type="text" id="doctorName" class="input-field" />
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="appointmentDate" class="input-field" required />
                    </div>
                    <div class="form-group">
                        <label>Time</label>
                        <select id="timeSlot" class="input-field" required>
                            <option value="">Select a time slot</option>
                            <option value="09:00-10:00">09:00-10:00</option>
                            <option value="10:00-11:00">10:00-11:00</option>
                            <option value="11:00-12:00">11:00-12:00</option>
                            <option value="12:00-13:00">12:00-13:00</option>
                            <option value="13:00-14:00">13:00-14:00</option>
                            <option value="14:00-15:00">14:00-15:00</option>
                            <option value="15:00-16:00">15:00-16:00</option>
                            <option value="16:00-17:00">16:00-17:00</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn">Update Appointment</button>
                    <button type="button" class="cancel-btn" onclick="window.history.back()">Cancel</button>
                </form>
            </main>

            <div id="footer"></div>
        </div>
    </div>

    <script type="module" src="../js/updateAppointment.js"></script>
</body>
</html>
