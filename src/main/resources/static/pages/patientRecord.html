<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Record</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/doctorDashboard.css" />
    <script src="../js/util.js" defer></script>
    <script src="../js/render.js" defer></script>
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>

            <main class="main-content">
                <h2>Patient <span>Record</span></h2>

                <table id="patientRecordTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Appointment ID</th>
                            <th>Patient ID</th>
                            <th>Prescription</th>
                        </tr>
                    </thead>
                    <tbody id="patientRecordBody">
                        <!-- Rows injected by patientRecordServices.js -->
                    </tbody>
                </table>
            </main>

            <div id="footer"></div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module" src="../js/patientRecordServices.js"></script>
</body>
</html>
