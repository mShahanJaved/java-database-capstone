<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link rel="stylesheet" href="../assets/css/adminDashboard.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/patientDashboard.css" />
    <script src="../js/util.js" defer></script>
    <script src="../js/render.js" defer></script>
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>

            <main class="main-content">
                <input type="text" id="searchBar" class="searchBar" placeholder="Search Bar for custom output" />

                <div class="filter-wrapper">
                    <select class="filter-select" id="filterTime">
                        <option value="">All Times</option>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                    <select class="filter-select" id="filterSpecialty">
                        <option value="">Filter by Specialty</option>
                        <option value="Cardiologist">Cardiologist</option>
                        <option value="Neurologist">Neurologist</option>
                        <option value="Orthopedist">Orthopedist</option>
                        <option value="Pediatrician">Pediatrician</option>
                        <option value="Dermatologist">Dermatologist</option>
                    </select>
                </div>

                <div id="content"></div>
            </main>

            <div id="footer"></div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="bookingModal" class="modalApp">
        <h3>Book <span>Appointment</span></h3>
        <div class="form-group">
            <label>Patient Name</label>
            <input type="text" id="patientName" class="input-field" readonly />
        </div>
        <div class="form-group">
            <label>Doctor Name</label>
            <input type="text" id="doctorName" class="input-field" readonly />
        </div>
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="appointmentDate" class="input-field" />
        </div>
        <div class="form-group">
            <label>Time Slot</label>
            <select id="timeSlot" class="input-field">
                <option value="">Select a time slot</option>
            </select>
        </div>
        <button class="confirmBookingBtn" id="confirmBooking">Book Now</button>
    </div>

    <script type="module" src="../js/loggedPatient.js"></script>
</body>
</html>
