<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>

    <!--
        CSS FILES:
        adminDashboard.css — Shared doctor card styles
        style.css — Global styles
        patientDashboard.css — Patient-specific styles (booking modal)
    -->
    <link rel="stylesheet" href="../assets/css/adminDashboard.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/patientDashboard.css" />

    <!--
        JAVASCRIPT FILES:
        render.js — Functions to create doctor cards
        util.js — Helper functions
        header.js — Dynamic header (shows "Login" + "Sign Up" or "Home" + "Appointments" + Logout)
        footer.js — Dynamic footer
        modals.js — Booking modal component
    -->
    <script src="../js/render.js" defer></script>
    <script src="../js/util.js" defer></script>
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
    <script type="module" src="../js/components/modals.js"></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <!--
                HEADER:
                - Not logged in: "Login" + "Sign Up"
                - Logged in: "Home" + "Appointments" + Logout
            -->
            <div id="header"></div>

            <!--
                MAIN CONTENT — Patient Dashboard
                This is the page patients see when they want to find a doctor.
                They can:
                1. Search by doctor name or specialty
                2. Filter by AM/PM availability
                3. Filter by specialty dropdown
                4. Click "Book Now" on any doctor card
            -->
            <main class="main-content">
                <!--
                    SEARCH BAR:
                    The course screenshot shows: "Search Bar for custom output"
                    Patients type a name or specialty to find doctors.
                -->
                <input type="text" id="searchBar" class="searchBar" placeholder="Search Bar for custom output" />

                <!--
                    FILTER SECTION:
                    Two dropdowns side by side:
                    1. AM/PM — Filter doctors by time availability
                    2. Specialty — Filter by medical specialty
                -->
                <div class="filter-wrapper">
                    <select class="filter-select" id="filterTime">
                        <option value="">All Times</option>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                    <select class="filter-select" id="filterSpecialty">
                        <option value="">Filter by Specialty</option>
                        <option value="Cardiologist">Cardiologist</option>
                        <option value="Neurologist">Neurologist</option>
                        <option value="Orthopedist">Orthopedist</option>
                        <option value="Pediatrician">Pediatrician</option>
                        <option value="Dermatologist">Dermatologist</option>
                    </select>
                </div>

                <!--
                    CONTENT AREA:
                    Doctor cards are dynamically injected here.
                    Each card shows: Name, Specialization, Email, Available times, "Book Now" button
                -->
                <div id="content"></div>
            </main>

            <div id="footer"></div>
        </div>
    </div>

    <!--
        MODAL — Booking form
        When "Book Now" is clicked, this modal slides up from the bottom.
        Shows: Patient Name, Doctor Name, Date picker, Time slot dropdown.
    -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!--
        BOOKING OVERLAY — Slides up from bottom
        This is the actual booking form shown in the course screenshots.
    -->
    <div id="bookingModal" class="modalApp">
        <h3>Book <span>Appointment</span></h3>
        <div class="form-group">
            <label>Patient Name</label>
            <input type="text" id="patientName" class="input-field" placeholder="Enter your name" />
        </div>
        <div class="form-group">
            <label>Doctor Name</label>
            <input type="text" id="doctorName" class="input-field" readonly />
        </div>
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="appointmentDate" class="input-field" />
        </div>
        <div class="form-group">
            <label>Time Slot</label>
            <select id="timeSlot" class="input-field">
                <option value="">Select a time slot</option>
            </select>
        </div>
        <button class="confirmBookingBtn" id="confirmBooking">Book Now</button>
    </div>

    <!--
        PAGE-SPECIFIC JAVASCRIPT:
        patientDashboard.js — Handles loading doctors, search, filters, booking
    -->
    <script src="../js/patientDashboard.js" defer></script>
</body>
</html>
