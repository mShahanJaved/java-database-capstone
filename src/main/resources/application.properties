# ============================================================
# SERVER
# ============================================================
server.port=8080
spring.application.name=smart-clinic-management

# ============================================================
# MYSQL DATABASE
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/cms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# MONGODB (for prescriptions)
# ============================================================
spring.data.mongodb.uri=mongodb://localhost:27017/prescriptions
spring.data.mongodb.database=prescriptions

# ============================================================
# THYMELEAF CONFIGURATION
# ============================================================
# Template location — where Thymeleaf looks for HTML files
spring.thymeleaf.prefix=classpath:/templates/

# Template suffix — all templates end with .html
spring.thymeleaf.suffix=.html

# Rendering mode
spring.thymeleaf.mode=HTML

# Disable caching during development (see changes without restart)
spring.thymeleaf.cache=false

# Character encoding
spring.thymeleaf.encoding=UTF-8

# ============================================================
# STATIC RESOURCES
# ============================================================
# Where Spring looks for CSS, JS, images
spring.web.resources.static-locations=classpath:/static/

# ============================================================
# JWT
# ============================================================
jwt.secret=smartClinicSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256
jwt.expiration=86400000

# ============================================================
# LOGGING
# ============================================================
logging.level.com.project.back_end=DEBUG
